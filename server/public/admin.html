<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ColourWang Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --border: #2e2e42;
      --accent: #7c5cfc;
      --accent-hover: #9a7ffe;
      --danger: #e05252;
      --danger-hover: #f07070;
      --warn: #e09a30;
      --warn-hover: #f0b450;
      --success: #3dba7e;
      --text: #e8e8f0;
      --muted: #8888aa;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      padding: 24px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    header h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.5px; }
    header h1 span { color: var(--accent); }
    .header-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    .pill {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
    }
    #game-count { font-weight: 600; color: var(--text); }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      white-space: nowrap;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-warn   { background: var(--warn);   color: #000; }
    .btn-warn:hover:not(:disabled)   { background: var(--warn-hover); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover:not(:disabled) { background: var(--danger-hover); }
    .btn-ghost  { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-ghost:hover:not(:disabled)  { border-color: var(--accent); color: var(--accent); }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .toolbar span { flex: 1; }

    #games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px;
    }

    .game-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: border-color 0.2s;
    }
    .game-card:hover { border-color: var(--accent); }

    .card-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .game-code { font-size: 1.4rem; font-weight: 800; letter-spacing: 3px; color: var(--accent); }

    .status-badge {
      font-size: 0.7rem; font-weight: 700;
      padding: 4px 10px; border-radius: 20px;
      text-transform: uppercase; letter-spacing: 1px;
    }
    .status-LOBBY        { background: #1e3b2e; color: #3dba7e; }
    .status-QUESTION     { background: #231a3f; color: #7c5cfc; }
    .status-RESULT       { background: #3b2e10; color: #e09a30; }
    .status-COUNTDOWN    { background: #3b2e10; color: #e09a30; }
    .status-ROUND_INTRO  { background: #1a2e3b; color: #5cb8e4; }
    .status-FINAL_SCORE  { background: #3b1a1a; color: #e05252; }

    .card-meta { display: flex; gap: 12px; flex-wrap: wrap; }
    .meta-item { font-size: 0.78rem; color: var(--muted); }
    .meta-item strong { color: var(--text); }

    .section-label {
      font-size: 0.72rem; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase;
      color: var(--muted); margin-bottom: 8px;
    }

    /* Settings chips */
    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 6px;
    }
    .setting-chip {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 7px 8px;
      border-radius: 8px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      text-align: center;
    }
    .setting-chip.on  { border-color: #2a3d2a; }
    .setting-chip.on  .chip-value { color: var(--success); }
    .setting-chip.off { border-color: #3d2a2a; }
    .setting-chip.off .chip-value { color: var(--danger); }
    .chip-label { color: var(--muted); font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .chip-value { font-weight: 700; color: var(--text); font-size: 0.78rem; }
    .chip-full  { grid-column: 1 / -1; }

    /* Players */
    .players-list {
      display: flex; flex-direction: column; gap: 4px;
      max-height: 180px; overflow-y: auto;
    }
    .player-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 5px 8px; border-radius: 6px;
      background: rgba(255,255,255,0.04);
      font-size: 0.82rem; gap: 8px;
    }
    .player-name  { flex: 1; font-weight: 500; }
    .player-score { font-weight: 700; color: var(--accent); min-width: 34px; text-align: right; }
    .player-streak { font-size: 0.7rem; color: var(--warn); }
    .conn-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .conn-dot.online  { background: var(--success); }
    .conn-dot.offline { background: var(--danger); }
    .no-players { color: var(--muted); font-size: 0.82rem; font-style: italic; }

    .card-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .card-actions button { flex: 1; padding: 8px 10px; font-size: 0.8rem; }

    #empty-state { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 1rem; }

    #refresh-info { font-size: 0.75rem; color: var(--muted); }
    #refresh-info.refreshing { color: var(--accent); }

    #toast-container {
      position: fixed; bottom: 24px; right: 24px;
      display: flex; flex-direction: column; gap: 8px; z-index: 9999;
    }
    .toast {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 18px;
      font-size: 0.85rem; max-width: 320px;
      animation: slide-in 0.2s ease;
    }
    .toast.success { border-color: var(--success); color: var(--success); }
    .toast.error   { border-color: var(--danger);  color: var(--danger); }

    @keyframes slide-in {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    #confirm-modal {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      align-items: center; justify-content: center; z-index: 9000;
    }
    #confirm-modal.open { display: flex; }
    .modal-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 28px; max-width: 360px; width: 90%;
      display: flex; flex-direction: column; gap: 16px;
    }
    .modal-box h3 { font-size: 1.1rem; }
    .modal-box p  { font-size: 0.875rem; color: var(--muted); }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

    @media (max-width: 500px) {
      body { padding: 14px; }
      #games-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <h1>Colour<span>Wang</span> Admin</h1>
  <div class="header-actions">
    <div class="pill">Active games: <span id="game-count">—</span></div>
    <div id="refresh-info" class="pill">Auto-refresh: 5s</div>
  </div>
</header>

<div class="toolbar">
  <span></span>
  <button class="btn-warn" id="btn-kill-all">⚠ Kill All Games</button>
  <button class="btn-ghost" id="btn-refresh">↺ Refresh now</button>
</div>

<div id="games-grid"></div>
<div id="empty-state" style="display:none">No active games at the moment.</div>

<div id="toast-container"></div>

<div id="confirm-modal" role="dialog" aria-modal="true">
  <div class="modal-box">
    <h3 id="confirm-title">Are you sure?</h3>
    <p id="confirm-body"></p>
    <div class="modal-actions">
      <button class="btn-ghost" id="confirm-cancel">Cancel</button>
      <button class="btn-danger" id="confirm-ok">Confirm</button>
    </div>
  </div>
</div>

<script>
  const BASE = window.location.origin;
  let refreshTimer = null;

  loadGames();
  startAutoRefresh();

  document.getElementById('btn-refresh').addEventListener('click', () => { loadGames(); startAutoRefresh(); });

  function startAutoRefresh() {
    clearInterval(refreshTimer);
    let countdown = 5;
    const info = document.getElementById('refresh-info');
    refreshTimer = setInterval(() => {
      countdown--;
      if (countdown <= 0) { countdown = 5; loadGames(); }
      info.textContent = `Auto-refresh: ${countdown}s`;
    }, 1000);
  }

  async function loadGames() {
    const info = document.getElementById('refresh-info');
    info.classList.add('refreshing');
    info.textContent = 'Refreshing…';
    try {
      const res = await fetch(`${BASE}/api/admin/games`);
      const games = await res.json();
      document.getElementById('game-count').textContent = games.length;
      renderGames(games);
    } catch {
      toast('Failed to load games', 'error');
    } finally {
      info.classList.remove('refreshing');
    }
  }

  function renderGames(games) {
    const grid = document.getElementById('games-grid');
    const empty = document.getElementById('empty-state');
    grid.innerHTML = '';

    if (!games.length) { empty.style.display = 'block'; return; }
    empty.style.display = 'none';

    games.forEach(g => {
      const card = document.createElement('div');
      card.className = 'game-card';

      const sortedPlayers = [...g.players].sort((a, b) => b.score - a.score);
      const playersHtml = sortedPlayers.length
        ? sortedPlayers.map(p => `
            <div class="player-row">
              <span class="conn-dot ${p.connected ? 'online' : 'offline'}" title="${p.connected ? 'Connected' : 'Disconnected'}"></span>
              <span class="player-name">${esc(p.name)}</span>
              ${p.streak >= 3 ? `<span class="player-streak">🔥${p.streak}</span>` : ''}
              <span class="player-score">${p.score}pts</span>
            </div>`).join('')
        : '<p class="no-players">No players yet</p>';

      card.innerHTML = `
        <div class="card-header">
          <span class="game-code">${esc(g.code)}</span>
          <span class="status-badge status-${g.status}">${g.status.replace('_', ' ')}</span>
        </div>
        <div class="card-meta">
          <span class="meta-item">Players: <strong>${g.playerCount}</strong></span>
          <span class="meta-item">Round: <strong>${g.currentRoundIndex + 1}/${g.totalRounds}</strong></span>
          <span class="meta-item">Q: <strong>${g.currentQuestionIndex + 1}/${g.questionsInRound}</strong></span>
          ${g.roundTitle ? `<span class="meta-item">📦 <strong>${esc(g.roundTitle)}</strong></span>` : ''}
        </div>
        <div>
          <p class="section-label">Settings</p>
          <div class="settings-grid">${renderSettings(g.settings)}</div>
        </div>
        <div>
          <p class="section-label">Players</p>
          <div class="players-list">${playersHtml}</div>
        </div>
        <div class="card-actions">
          <button class="btn-warn btn-reset" data-code="${esc(g.code)}">↺ Reset to Lobby</button>
          <button class="btn-danger btn-kill" data-code="${esc(g.code)}">✕ Kill Game</button>
        </div>`;

      grid.appendChild(card);
    });

    document.querySelectorAll('.btn-kill').forEach(btn =>
      btn.addEventListener('click', () => confirmAction(
        `Kill game ${btn.dataset.code}?`,
        'All players will be disconnected and the game will be removed.',
        () => killGame(btn.dataset.code)
      ))
    );
    document.querySelectorAll('.btn-reset').forEach(btn =>
      btn.addEventListener('click', () => confirmAction(
        `Reset game ${btn.dataset.code}?`,
        'The game will be sent back to the lobby and all scores will be cleared.',
        () => resetGame(btn.dataset.code)
      ))
    );
  }

  function renderSettings(s) {
    if (!s) return '';
    const bool = (label, val, icon) => {
      const on = val !== false;
      return `<div class="setting-chip ${on ? 'on' : 'off'}">
        <span class="chip-label">${label}</span>
        <span class="chip-value">${icon} ${on ? 'On' : 'Off'}</span>
      </div>`;
    };
    const dur = (label, v) => `<div class="setting-chip">
        <span class="chip-label">${label}</span>
        <span class="chip-value">${v != null ? v + 's' : '—'}</span>
      </div>`;
    return [
      dur('Timer', s.timerDuration),
      dur('Result', s.resultDuration),
      dur('Lobby', s.lobbyDuration),
      bool('Jokers', s.jokersEnabled, '🃏'),
      bool('Blocks', s.blocksEnabled, '🛡'),
      bool('Streaks', s.streaksEnabled, '🔥'),
      bool('Fastest', s.fastestFingerEnabled, '⚡'),
      bool('Sound', s.soundEnabled, '🔊'),
      bool('Music', s.musicEnabled, '🎵'),
      s.musicEnabled !== false && s.bgmTrack
        ? `<div class="setting-chip chip-full">
            <span class="chip-label">BGM Track</span>
            <span class="chip-value">🎵 ${esc(s.bgmTrack.replace(/\.mp3$/i, ''))}</span>
          </div>`
        : '',
    ].join('');
  }

  document.getElementById('btn-kill-all').addEventListener('click', () => {
    const count = parseInt(document.getElementById('game-count').textContent) || 0;
    if (count === 0) { toast('No active games to kill', 'error'); return; }
    confirmAction(`Kill ALL ${count} game(s)?`, 'Every active game will be terminated immediately.', killAll);
  });

  async function killGame(code) {
    try {
      const res = await fetch(`${BASE}/api/admin/games/${code}`, { method: 'DELETE' });
      const data = await res.json();
      if (res.ok) { toast(`Game ${code} killed`, 'success'); loadGames(); }
      else toast(data.error || 'Failed', 'error');
    } catch { toast('Request failed', 'error'); }
  }

  async function resetGame(code) {
    try {
      const res = await fetch(`${BASE}/api/admin/games/${code}/reset`, { method: 'POST' });
      const data = await res.json();
      if (res.ok) { toast(`Game ${code} reset to lobby`, 'success'); loadGames(); }
      else toast(data.error || 'Failed', 'error');
    } catch { toast('Request failed', 'error'); }
  }

  async function killAll() {
    try {
      const res = await fetch(`${BASE}/api/admin/games`, { method: 'DELETE' });
      const data = await res.json();
      if (res.ok) { toast(`Killed ${data.killed.length} game(s)`, 'success'); loadGames(); }
      else toast(data.error || 'Failed', 'error');
    } catch { toast('Request failed', 'error'); }
  }

  let confirmCallback = null;
  function confirmAction(title, body, callback) {
    document.getElementById('confirm-title').textContent = title;
    document.getElementById('confirm-body').textContent = body;
    confirmCallback = callback;
    document.getElementById('confirm-modal').classList.add('open');
  }
  document.getElementById('confirm-cancel').addEventListener('click', () => {
    document.getElementById('confirm-modal').classList.remove('open');
    confirmCallback = null;
  });
  document.getElementById('confirm-ok').addEventListener('click', () => {
    document.getElementById('confirm-modal').classList.remove('open');
    if (confirmCallback) { confirmCallback(); confirmCallback = null; }
  });
  document.getElementById('confirm-modal').addEventListener('click', e => {
    if (e.target === document.getElementById('confirm-modal')) {
      document.getElementById('confirm-modal').classList.remove('open');
      confirmCallback = null;
    }
  });

  function toast(msg, type = 'success') {
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = msg;
    document.getElementById('toast-container').appendChild(el);
    setTimeout(() => el.remove(), 3500);
  }

  function esc(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
