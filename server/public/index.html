<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ColourWang – Game & Admin</title>
  <meta name="description"
    content="ColourWang is the ultimate live multiplayer colour trivia game. Host a game or manage live rooms." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="main.css" />
</head>

<body class="bg-[#0f0f13] text-[#e8e8f0] font-sans min-h-screen p-3.5 sm:p-6 relative">

  <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
    <div class="absolute -inset-[50%] animate-mesh-drift bg-[radial-gradient(ellipse_60%_50%_at_20%_30%,rgba(124,92,252,0.18)_0%,transparent_70%),radial-gradient(ellipse_50%_60%_at_80%_20%,rgba(0,229,255,0.12)_0%,transparent_70%),radial-gradient(ellipse_70%_40%_at_50%_80%,rgba(248,58,123,0.10)_0%,transparent_70%)]"></div>
  </div>

  <div class="fixed inset-0 z-0 pointer-events-none bg-[linear-gradient(rgba(255,255,255,0.025)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.025)_1px,transparent_1px)] bg-[size:48px_48px]"></div>

  <div class="relative z-10 max-w-[1200px] mx-auto">

    <header class="flex items-center justify-between mb-6 flex-wrap gap-3">
      <h1 class="text-[1.6rem] font-bold tracking-[-0.5px]">
        Colour<span class="text-[#7c5cfc]">Wang</span> <span id="header-subtitle" class="text-xs uppercase tracking-widest text-[#8888aa] ml-1">(Main)</span>
      </h1>
      
      <div class="flex items-center gap-2.5 flex-wrap">
        <button id="nav-toggle" class="bg-[#1a1a24] border border-[#2e2e42] hover:border-[#7c5cfc] hover:text-[#7c5cfc] rounded-lg px-3.5 py-1.5 text-[0.8rem] text-[#e8e8f0] font-semibold transition-colors cursor-pointer">
          Switch to Admin View
        </button>
        <div id="status-badge" class="bg-[#1a1a24] border border-[#2e2e42] rounded-lg px-3.5 py-1.5 text-[0.8rem] text-[#8888aa] whitespace-nowrap">
          Active games: <span id="game-count" class="font-semibold text-[#e8e8f0]">—</span>
        </div>
        <div id="refresh-info" class="bg-[#1a1a24] border border-[#2e2e42] rounded-lg px-3.5 py-1.5 text-[0.75rem] text-[#8888aa] whitespace-nowrap transition-colors hidden">
          Auto-refresh: 5s
        </div>
      </div>
    </header>

    <section id="main-view" class="flex flex-col items-center justify-center py-12 text-center gap-6">
      <h2 class="text-4xl sm:text-5xl font-black font-outfit tracking-tight">
        Welcome to ColourWang
      </h2>
      <p class="max-w-md text-[#8888aa] text-base sm:text-lg">
        The ultimate live multiplayer colour trivia game. Host a game room or jump straight into an active game!
      </p>
      <div class="flex flex-wrap gap-4 justify-center mt-2">
        <button class="bg-[#7c5cfc] hover:bg-[#9a7ffe] text-white font-bold px-6 py-3 rounded-xl transition-colors cursor-pointer">
          Host a Game
        </button>
        <button class="bg-[#1a1a24] border border-[#2e2e42] hover:border-[#7c5cfc] text-[#e8e8f0] font-bold px-6 py-3 rounded-xl transition-colors cursor-pointer">
          Join Game
        </button>
      </div>
    </section>

    <section id="admin-view" class="hidden">
      <div class="flex items-center gap-2.5 mb-5 flex-wrap">
        <span class="flex-1"></span>
        <button id="btn-kill-all" class="bg-[#e09a30] text-black hover:bg-[#f0b450] disabled:opacity-40 disabled:cursor-not-allowed border-0 rounded-lg px-4 py-2.5 text-[0.875rem] font-semibold cursor-pointer transition-colors whitespace-nowrap">
          ⚠ Kill All Games
        </button>
        <button id="btn-refresh" class="bg-transparent border border-[#2e2e42] text-[#e8e8f0] hover:border-[#7c5cfc] hover:text-[#7c5cfc] disabled:opacity-40 disabled:cursor-not-allowed rounded-lg px-4 py-2.5 text-[0.875rem] font-semibold cursor-pointer transition-colors whitespace-nowrap">
          ↺ Refresh now
        </button>
      </div>

      <div id="games-grid" class="grid grid-cols-1 sm:grid-cols-[repeat(auto-fill,minmax(340px,1fr))] gap-4"></div>

      <div id="empty-state" class="text-center py-16 px-5 text-[#8888aa] text-base hidden">
        No active games at the moment.
      </div>
    </section>

  </div>

  <div id="toast-container" class="fixed bottom-6 right-6 flex flex-col gap-2 z-[9999]"></div>

  <div id="confirm-modal" role="dialog" aria-modal="true" class="hidden fixed inset-0 bg-black/70 items-center justify-center z-[9000]">
    <div class="bg-[#1a1a24] border border-[#2e2e42] rounded-2xl p-7 max-w-[360px] w-[90%] flex flex-col gap-4">
      <h3 id="confirm-title" class="text-[1.1rem] font-bold">Are you sure?</h3>
      <p id="confirm-body" class="text-[0.875rem] text-[#8888aa]"></p>
      <div class="flex gap-2.5 justify-end">
        <button id="confirm-cancel" class="bg-transparent border border-[#2e2e42] text-[#e8e8f0] hover:border-[#7c5cfc] hover:text-[#7c5cfc] rounded-lg px-4.5 py-2.5 text-[0.875rem] font-semibold cursor-pointer transition-colors whitespace-nowrap">
          Cancel
        </button>
        <button id="confirm-ok" class="bg-[#e05252] text-white hover:bg-[#f07070] rounded-lg px-4.5 py-2.5 text-[0.875rem] font-semibold cursor-pointer transition-colors whitespace-nowrap">
          Confirm
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
